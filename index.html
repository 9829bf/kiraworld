<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#87ceeb">
<title>KiraWorld</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{font-family:'Baloo 2',sans-serif;}

/* ══ WALLPAPER ══ */
.wallpaper{
  position:fixed;inset:0;z-index:0;
  background:linear-gradient(160deg,#a8edff 0%,#7dd8f5 25%,#a8f0c8 55%,#c8f5a0 80%,#ffe8a0 100%);
}
/* soft clouds */
.wcloud{position:absolute;border-radius:999px;background:rgba(255,255,255,.55);filter:blur(18px)}
.wc1{width:260px;height:80px;top:6%;left:-40px}
.wc2{width:200px;height:60px;top:14%;right:-30px}
.wc3{width:160px;height:50px;top:28%;left:20%}
.wc4{width:180px;height:55px;bottom:22%;right:10%}

/* sun top left */
.wsun{
  position:absolute;width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fffde0,#ffe566 50%,#ffb020);
  box-shadow:0 0 40px 14px rgba(255,200,50,.35);
  top:3%;left:5%;
  animation:sunbob 6s ease-in-out infinite;
}
@keyframes sunbob{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}

/* little birds */
.birds{position:absolute;top:18%;font-size:18px;animation:bfly 18s linear infinite;opacity:.7}
@keyframes bfly{from{transform:translateX(-80px)}to{transform:translateX(110vw)}}

/* grass bottom strip */
.grass{
  position:absolute;bottom:0;left:0;width:100%;height:80px;
  background:linear-gradient(180deg,#7ec850,#5aaa30);
  border-radius:40px 40px 0 0;
}
.grass::before{
  content:'';position:absolute;top:-18px;left:0;width:100%;height:30px;
  background:radial-gradient(ellipse at 50% 100%,#7ec850 60%,transparent 100%);
}

/* ══ APP SHELL ══ */
.app{
  position:relative;z-index:10;
  height:100%;display:flex;flex-direction:column;
  max-width:430px;margin:0 auto;
}

/* ══ STATUS BAR (fake iPhone) ══ */
.statusbar{
  height:44px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;
  font-size:13px;font-weight:800;color:rgba(0,0,0,.55);
}
.status-time{font-size:16px;font-weight:800}
.status-icons{display:flex;gap:5px;align-items:center;font-size:13px}

/* ══ TOP GREETING ══ */
.greeting{
  flex-shrink:0;
  padding:4px 20px 0;
  display:flex;align-items:center;justify-content:space-between;
}
.greet-text{
  font-family:'Lilita One',cursive;
  font-size:min(26px,6.5vw);
  color:#1a4a1a;
  text-shadow:0 2px 0 rgba(255,255,255,.6);
  line-height:1.2;
}
.greet-sub{
  font-size:13px;font-weight:700;
  color:rgba(30,80,30,.65);margin-top:1px;
}
.pio-small{animation:piosmall 3s ease-in-out infinite}
@keyframes piosmall{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-5px)}}

/* ══ ICONS GRID ══ */
.icons-wrap{
  flex:1;min-height:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 14px 90px;
}
.icons-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px 4px;
}

/* ══ APP ICON ══ */
.app-icon{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  cursor:pointer;padding:4px 2px;
  -webkit-tap-highlight-color:transparent;
}
.app-icon:active .icon-img{transform:scale(.88)}
.app-icon.locked{opacity:.5;cursor:default}
.app-icon.locked:active .icon-img{transform:none}

.icon-img{
  width:min(72px,17vw);height:min(72px,17vw);
  border-radius:min(16px,4vw);
  display:grid;place-items:center;
  font-size:min(36px,8.5vw);
  box-shadow:
    0 4px 0 rgba(0,0,0,.18),
    0 6px 16px rgba(0,0,0,.15),
    inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .1s cubic-bezier(.2,1.4,.4,1);
  position:relative;overflow:hidden;
  flex-shrink:0;
}
/* shine on icon */
.icon-img::after{
  content:'';position:absolute;
  top:0;left:0;right:0;height:45%;
  background:linear-gradient(180deg,rgba(255,255,255,.35),transparent);
  border-radius:inherit;pointer-events:none;
}

.icon-name{
  font-size:min(11px,2.6vw);font-weight:700;
  color:#1a3a1a;text-align:center;
  text-shadow:0 1px 3px rgba(255,255,255,.8);
  line-height:1.2;
  max-width:min(76px,18vw);
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}

/* lock badge */
.lock-badge{
  position:absolute;bottom:3px;right:3px;
  font-size:14px;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));
}

/* new dot */
.new-dot{
  position:absolute;top:-3px;right:-3px;
  width:14px;height:14px;border-radius:50%;
  background:#ff3b30;
  border:2px solid rgba(255,255,255,.9);
  box-shadow:0 2px 6px rgba(255,60,48,.6);
}

/* ══ DOCK ══ */
.dock{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  width:calc(100% - 28px);max-width:400px;
  height:80px;
  background:rgba(255,255,255,.38);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:28px;
  border:1px solid rgba(255,255,255,.55);
  box-shadow:0 8px 32px rgba(0,0,0,.12);
  display:flex;align-items:center;justify-content:space-around;
  padding:0 16px;
  z-index:20;
}
.dock .app-icon{gap:0}
.dock .icon-name{display:none}
.dock .icon-img{
  width:min(58px,13.5vw);height:min(58px,13.5vw);
  border-radius:min(13px,3vw);
}

/* ══ HOME INDICATOR ══ */
.home-indicator{
  position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
  width:120px;height:4px;border-radius:2px;
  background:rgba(0,0,0,.18);z-index:30;
}
</style>
</head>
<body>

<div class="wallpaper">
  <div class="wsun"></div>
  <div class="wcloud wc1"></div>
  <div class="wcloud wc2"></div>
  <div class="wcloud wc3"></div>
  <div class="wcloud wc4"></div>
  <div class="birds">🐦 🐦</div>
  <div class="grass"></div>
</div>

<div class="app">

  <!-- fake status bar -->
  <div class="statusbar">
    <span class="status-time" id="clockEl">9:41</span>
    <div class="status-icons">
      <span>📶</span><span>🔋</span>
    </div>
  </div>

  <!-- greeting -->
  <div class="greeting">
    <div>
      <div class="greet-text" id="greetTxt">¡Hola, Kira! 🌟</div>
      <div class="greet-sub">¿A qué jugamos hoy?</div>
    </div>
    <div class="pio-small" id="pioCont"></div>
  </div>

  <!-- icons -->
  <div class="icons-wrap">
    <div class="icons-grid" id="iconsGrid"></div>
  </div>

  <!-- dock -->
  <div class="dock" id="dock"></div>
  <div class="home-indicator"></div>

</div>

<script>
/* ══════════════════════════════════════════
   GAMES REGISTRY
   Añadir juego nuevo = añadir objeto aquí
══════════════════════════════════════════ */
const GAMES = [
  // ── DOCK (pinned) ──────────────────────
  {
    id:'aventura', name:'Aventura', icon:'🗺️',
    bg:'linear-gradient(145deg,#22c55e,#15803d)',
    url:'aventura/', locked:false, badge:'new', dock:true,
  },
  // ── GRID ──────────────────────────────
  {
    id:'memoria', name:'Memoria', icon:'🧠',
    bg:'linear-gradient(145deg,#3b82f6,#1d4ed8)',
    url:'memoria/', locked:true, dock:false,
  },
  {
    id:'puzzle', name:'Puzzle', icon:'🧩',
    bg:'linear-gradient(145deg,#a855f7,#7e22ce)',
    url:'puzzle/', locked:true, dock:false,
  },
  {
    id:'numeros', name:'Números', icon:'🔢',
    bg:'linear-gradient(145deg,#f59e0b,#d97706)',
    url:'numeros/', locked:true, dock:false,
  },
  {
    id:'letras', name:'Letras', icon:'🔤',
    bg:'linear-gradient(145deg,#06b6d4,#0284c7)',
    url:'letras/', locked:true, dock:false,
  },
  {
    id:'pintura', name:'Pintura', icon:'🎨',
    bg:'linear-gradient(145deg,#f43f5e,#be123c)',
    url:'pintura/', locked:true, dock:false,
  },
  {
    id:'musica', name:'Música', icon:'🎵',
    bg:'linear-gradient(145deg,#ec4899,#be185d)',
    url:'musica/', locked:true, dock:false,
  },
  {
    id:'cuentos', name:'Cuentos', icon:'📖',
    bg:'linear-gradient(145deg,#f97316,#c2410c)',
    url:'cuentos/', locked:true, dock:false,
  },
  {
    id:'cocina', name:'Cocinitas', icon:'🍳',
    bg:'linear-gradient(145deg,#84cc16,#4d7c0f)',
    url:'cocina/', locked:true, dock:false,
  },
  {
    id:'animales', name:'Animales', icon:'🦁',
    bg:'linear-gradient(145deg,#fb923c,#c2410c)',
    url:'animales/', locked:true, dock:false,
  },
  {
    id:'espacio', name:'Espacio', icon:'🚀',
    bg:'linear-gradient(145deg,#6366f1,#3730a3)',
    url:'espacio/', locked:true, dock:false,
  },
  {
    id:'fotos', name:'Mis fotos', icon:'📸',
    bg:'linear-gradient(145deg,#14b8a6,#0f766e)',
    url:'fotos/', locked:true, dock:false,
  },
];

/* ══ BUILD ICON ══ */
function buildIcon(g){
  const wrap = document.createElement('div');
  wrap.className = 'app-icon' + (g.locked ? ' locked' : '');

  const img = document.createElement('div');
  img.className = 'icon-img';
  img.style.background = g.bg;
  img.innerHTML = g.icon;

  if(g.badge === 'new') img.innerHTML += `<div class="new-dot"></div>`;
  if(g.locked) img.innerHTML += `<div class="lock-badge">🔒</div>`;

  const name = document.createElement('div');
  name.className = 'icon-name';
  name.textContent = g.name;

  wrap.appendChild(img);
  wrap.appendChild(name);

  if(!g.locked){
    wrap.onclick = () => {
      img.style.transform = 'scale(.82)';
      setTimeout(() => { window.location.href = g.url; }, 180);
    };
  }
  return wrap;
}

/* ══ POPULATE ══ */
const grid = document.getElementById('iconsGrid');
const dock = document.getElementById('dock');

GAMES.forEach(g => {
  if(g.dock) dock.appendChild(buildIcon(g));
  else grid.appendChild(buildIcon(g));
});

/* ══ CLOCK ══ */
function updateClock(){
  const d = new Date();
  const h = d.getHours().toString().padStart(2,'0');
  const m = d.getMinutes().toString().padStart(2,'0');
  document.getElementById('clockEl').textContent = h + ':' + m;
}
updateClock();
setInterval(updateClock, 10000);

/* ══ GREETING ══ */
const hour = new Date().getHours();
const greet = hour < 12 ? '¡Buenos días, Kira! ☀️'
            : hour < 18 ? '¡Hola, Kira! 🌟'
            : '¡Buenas tardes! 🌅';
document.getElementById('greetTxt').textContent = greet;

/* ══ PÍO mini ══ */
document.getElementById('pioCont').innerHTML = `
<svg viewBox="0 0 200 200" width="54" height="54" xmlns="http://www.w3.org/2000/svg">
<ellipse cx="100" cy="128" rx="62" ry="58" fill="#f5a623"/>
<ellipse cx="100" cy="128" rx="48" ry="44" fill="#ffc851"/>
<ellipse cx="152" cy="120" rx="28" ry="18" fill="#e8860a" transform="rotate(20,152,120)"/>
<ellipse cx="48"  cy="120" rx="28" ry="18" fill="#e8860a" transform="rotate(-20,48,120)"/>
<ellipse cx="100" cy="86"  rx="52" ry="50" fill="#f5a623"/>
<ellipse cx="100" cy="86"  rx="38" ry="36" fill="#ffc851"/>
<rect x="52" y="56" width="96" height="36" rx="18" fill="#22c55e"/>
<ellipse cx="100" cy="56" rx="44" ry="12" fill="#22c55e"/>
<rect x="88" y="44" width="24" height="14" rx="4" fill="#ffdd57"/>
<circle cx="82"  cy="88" r="16" fill="#fff"/>
<circle cx="118" cy="88" r="16" fill="#fff"/>
<circle cx="85"  cy="91" r="9"  fill="#18120a"/>
<circle cx="115" cy="91" r="9"  fill="#18120a"/>
<circle cx="88"  cy="88" r="4"  fill="#fff"/>
<circle cx="117" cy="88" r="4"  fill="#fff"/>
<path d="M68 72 Q82 62 96 70" stroke="#6b4a18" stroke-width="4.5" fill="none" stroke-linecap="round"/>
<path d="M104 70 Q118 62 132 72" stroke="#6b4a18" stroke-width="4.5" fill="none" stroke-linecap="round"/>
<path d="M88 106 Q100 120 112 106 Q107 128 100 130 Q93 128 88 106Z" fill="#ff6b35"/>
<circle cx="62"  cy="108" r="13" fill="#ff8c70" opacity=".45"/>
<circle cx="138" cy="108" r="13" fill="#ff8c70" opacity=".45"/>
</svg>`;
</script>
</body>
</html>
